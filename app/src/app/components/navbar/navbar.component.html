<div class="navbar-container">
  <!-- MONITORES < 1114 PX -->
  @if (isMobileScreen()) {
    <div class="mobile">
      <div class="navbar">
        <div class="menu-icon">
          @if (openMenu()) {
            <button (click)="drawer.toggle(); funcaoTeste()" mat-icon-button>
              <mat-icon>menu</mat-icon>
            </button>
          } @else {
            <button (click)="drawer.toggle(); funcaoTeste()" mat-icon-button>
              <mat-icon>close</mat-icon>
            </button>
          }
        </div>
        
        <div class="logo">
          <img (click)="funcaoTeste()" src="../../assets/img/PetStores(200×200px)/1.svg" alt="Pet Stores Logo">
        </div>

        <div class="icons" style="margin-left: auto;">
          <button mat-icon-button>
            <mat-icon>shopping_cart</mat-icon>
          </button>
        </div>
      </div>

      <div class="pesquisar-mobile">
        <div class="search-container">
          <input matInput placeholder="Pesquisar">
          <mat-icon class="search-icon">search</mat-icon>
        </div>
      </div>

      <mat-drawer #drawer class="example-sidenav" mode="side">
        <p>Menu Lateral</p>
        @if (showFiller()) {
          <p>Opções em breve...</p>
        }
        <button (click)="showFiller.set(!showFiller())" mat-raised-button>
          Ver mais
        </button>
      </mat-drawer>
    </div>
  } @else {
    <!-- MONITORES > 1114 PX -->
    <div class="navbar">
      <div class="logo">
        <img (click)="funcaoTeste()" src="../../assets/img/Pet Stores (200 × 200 px).svg" alt="Pet Stores Logo">
      </div>

      <div class="nav-item" (click)="funcaoTeste()" style="margin-left: 20px;">
        <mat-icon>location_on</mat-icon>
        <span>Lojas</span>
      </div>

      <div class="search-container">
        <input matInput placeholder="O que seu pet precisa hoje?">
        <mat-icon class="search-icon" (click)="funcaoTeste()">search</mat-icon>
      </div>

      <div class="nav-item" (click)="funcaoTeste()">
        <mat-icon>local_shipping</mat-icon>
        <span>Pedidos</span>
      </div>

      <div class="nav-item" (click)="funcaoTeste()">
        <mat-icon>favorite</mat-icon>
        <span>Favoritos</span>
      </div>

      <div class="nav-item" (click)="funcaoTeste()">
        <mat-icon>shopping_cart</mat-icon>
        <span>Carrinho</span>
      </div>

      <div class="nav-item" (click)="funcaoTeste()">
        <mat-icon>account_circle</mat-icon>
        <span>Entrar</span>
      </div>
    </div>

    <div class="navbar-2">
      <div class="links">
        <select class="select" matNativeControl required>
          <option value="" disabled selected hidden>Pets</option>
          @for (opcoes of listaPets(); track opcoes) {
            <option [value]="opcoes.value">{{ opcoes.value }}</option>
          }
        </select>
        <select class="select" matNativeControl required>
          <option value="" disabled selected hidden>Lojas</option>
          @for (opcoes of listaLojas(); track opcoes) {
            <option [value]="opcoes.value">{{ opcoes.value }}</option>
          }
        </select>
        <select class="select" matNativeControl required>
          <option value="" disabled selected hidden>Agendamentos</option>
          @for (opcoes of listaAgendamentos(); track opcoes) {
            <option [value]="opcoes.value">{{ opcoes.value }}</option>
          }
        </select>
        <select class="select" matNativeControl required>
          <option value="" disabled selected hidden>Marcas</option>
          @for (opcoes of listaMarcas(); track opcoes) {
            <option [value]="opcoes.value">{{ opcoes.value }}</option>
          }
        </select>
        <select class="select" matNativeControl required>
          <option value="" disabled selected hidden>Serviços</option>
          @for (opcoes of listaServicos(); track opcoes) {
            <option [value]="opcoes.value">{{ opcoes.value }}</option>
          }
        </select>
        <select class="select" matNativeControl required>
          <option value="" disabled selected hidden>Mais</option>
          @for (opcoes of listaMais(); track opcoes) {
            <option [value]="opcoes.value">{{ opcoes.value }}</option>
          }
        </select>
        <div class="nav-item help-section" (click)="funcaoTeste()">
          <mat-icon class="support-icon">support_agent</mat-icon>
          <select class="select" matNativeControl required>
            <option value="" disabled selected hidden>Ajuda</option>
            @for (opcoes of listaAjuda(); track opcoes) {
              <option [value]="opcoes.value">{{ opcoes.value }}</option>
            }
          </select>
        </div>
      </div>
    </div>
  }
</div>
