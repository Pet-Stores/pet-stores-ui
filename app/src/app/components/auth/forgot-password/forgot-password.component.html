<div class="forgot-modal">
  <div class="modal-header">
    <div class="logo-container">
      <img src="assets/img/Pet Stores (200 × 200 px).svg" alt="Pet Stores Logo">
    </div>
    <button mat-icon-button (click)="close()" class="close-btn">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="modal-body">
    <h2>Recuperar senha</h2>
    <p class="subtitle">Insira seu e-mail ou número de telefone para receber as instruções de redefinição.</p>

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width" [class.phone-mode]="isPhoneMode()">
        <mat-label>E-mail ou Telefone</mat-label>
        
        <span matPrefix *ngIf="isPhoneMode()" class="country-prefix">
          {{ selectedCountry().flag }}
        </span>

        <input matInput formControlName="emailOrPhone" [placeholder]="isPhoneMode() ? selectedCountry().mask : 'Ex: joao@email.com'">
        
        <mat-icon matSuffix *ngIf="!isPhoneMode()">person</mat-icon>
        <mat-icon matSuffix *ngIf="isPhoneMode()">phone</mat-icon>

        <mat-error *ngIf="forgotForm.get('emailOrPhone')?.hasError('required')">
          Este campo é obrigatório
        </mat-error>
      </mat-form-field>

      <button mat-flat-button color="primary" class="submit-btn premium-shine" type="submit" [disabled]="forgotForm.invalid">
        ENVIAR LINK
      </button>
    </form>
  </div>

  <div class="modal-footer">
    <p>Lembrou da senha? <a href="javascript:void(0)" (click)="goToLogin($event)">Voltar para o Login</a></p>
  </div>
</div>
